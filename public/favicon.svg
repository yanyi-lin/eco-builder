<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- eco-builder favicon -->
  <!-- 隐喻结构：圆角底块(应用容器) + 聊天气泡(智能体/自然语言)
       + 气泡内纯节点网络(生态系统)：底层 3 绿点=基础组分(生产者层)，
         上层红/黄点=高位组分(消费者层)，颜色区分营养层级 -->
  <!-- 关系表达：深绿实线=已确立的相互作用；
       灰绿虚线(G2-R)=尚在建立的新关系（静态"构建中"叙事） -->
  <!-- 节点均为空心圆环：填充米白以遮盖线头，同时与底块融为一体 -->

  <!-- 米白圆角底块：明暗主题标签栏下均可读 -->
  <rect width="32" height="32" rx="7" fill="#fefef7"/>

  <!-- 网络连线层：先画线，空心节点叠于其上遮盖接缝 -->
  <g stroke="#2c5e3a" stroke-width="1.2" stroke-linecap="round" fill="none">
    <!-- 底层绿点横向链路 -->
    <path d="M11.8 16.9 L16.6 18.6"/>
    <path d="M16.6 18.6 L21.3 16.9"/>
    <!-- 底层向上连接红/黄高位节点 -->
    <path d="M11.8 16.9 L14.4 7.8"/>
    <path d="M21.3 16.9 L21 9.7"/>
    <!-- 高位节点之间 -->
    <path d="M14.4 7.8 L21 9.7"/>
  </g>

  <!-- 建立中的新关系：绿点 G2 到红色节点的灰绿虚线 -->
  <path d="M16.6 18.6 L21 9.7" stroke="#6c8b66" stroke-width="1"
        stroke-linecap="round" stroke-dasharray="1.3 2" fill="none"/>

  <!-- 底层绿色空心节点 x3（生产者层） -->
  <circle cx="11.8" cy="16.9" r="1.42" fill="#fefef7" stroke="#2c5e3a" stroke-width="1.25"/>
  <circle cx="16.6" cy="18.6" r="1.42" fill="#fefef7" stroke="#2c5e3a" stroke-width="1.25"/>
  <circle cx="21.3" cy="16.9" r="1.42" fill="#fefef7" stroke="#2c5e3a" stroke-width="1.25"/>

  <!-- 上层空心节点：黄色与红色（消费者层） -->
  <circle cx="14.4" cy="7.8" r="1.31" fill="#fefef7" stroke="#d19c2f" stroke-width="1.25"/>
  <circle cx="21" cy="9.7" r="1.31" fill="#fefef7" stroke="#b35e4a" stroke-width="1.25"/>

  <!-- 聊天气泡：单一路径含轮廓与左下尾巴，避免描边接缝 -->
  <path d="M10.5 3.5 H21.5 Q27.5 3.5 27.5 9.5 V16.5 Q27.5 22.5 21.5 22.5
           H11.2 L6.8 27.3 L8.6 22.5 H10.5 Q4.5 22.5 4.5 16.5 V9.5 Q4.5 3.5 10.5 3.5 Z"
        fill="none" stroke="#2c5e3a" stroke-width="2" stroke-linejoin="round"/>
</svg>
