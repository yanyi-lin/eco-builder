# ========================= GitHub → Gitee 镜像同步 =========================
# 单向只读镜像：push 到 main 时自动把完整历史同步到 Gitee（国内 clone/部署用）。
# - Gitee 仓库：https://gitee.com/lin_Yanyi/eco-builder（公开，空仓库起步）
# - 凭据：GITEE_TOKEN（GitHub Actions Secret，Gitee 私人令牌，仅 projects 权限）
# - 安全：token 通过 credential helper 注入，不进入 URL 与日志
# - 同步范围：main 分支 + 全部 tag；--force 保证镜像与 GitHub 完全一致
# - 注意：若 Gitee 端默认分支仍是空的 master，可在 Gitee 设置里把默认分支改为 main

name: Sync to Gitee

on:
  push:
    branches: [main]

jobs:
  sync:
    name: Mirror main to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitee GE007 钩子拒绝推送含 GitHub 隐藏邮箱（@users.noreply.github.com）的提交。
      # 只读镜像方案：同步时把 noreply 邮箱重写为该贡献者的真实公开邮箱
      # （liusonwood@outlook.com，git 历史有证据），不影响 GitHub 主仓。
      - name: Rewrite hidden emails (Gitee GE007 hook)
        run: |
          git filter-branch --force --env-filter '
            old="103164286+liusonwood@users.noreply.github.com"
            new="liusonwood@outlook.com"
            if [ "$GIT_AUTHOR_EMAIL" = "$old" ]; then export GIT_AUTHOR_EMAIL="$new"; fi
            if [ "$GIT_COMMITTER_EMAIL" = "$old" ]; then export GIT_COMMITTER_EMAIL="$new"; fi
          ' -- --all

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # Gitee HTTP Basic 认证：username=Gitee 用户名，password=私人令牌
          git config --global credential.helper '!f() { echo "username=lin_Yanyi"; echo "password=${GITEE_TOKEN}"; }; f'
          # 低速超时：Gitee 对海外 runner 响应慢，避免 git 无限挂起
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 90
          git remote add gitee https://gitee.com/lin_Yanyi/eco-builder.git
          git push --force gitee "refs/heads/main:refs/heads/main"
          git push --force gitee --tags
