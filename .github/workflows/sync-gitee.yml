# ========================= GitHub → Gitee 镜像同步 =========================
# 单向只读镜像（全量历史，最简版）：push 到 main 时自动把完整历史同步到 Gitee。
# - Gitee 仓库：https://gitee.com/lin_Yanyi/eco-builder（公开）
# - 凭据：GITEE_TOKEN（GitHub Actions Secret，Gitee 私人令牌，仅 projects 权限）
# - 安全：token 通过 credential helper 注入，不进入 URL 与日志
# - 默认分支：push 后通过 API 把 Gitee 默认分支设为 main（防新仓库空 master 拉空）
# - 备注：历史含 GitHub noreply 邮箱提交，若 Gitee 邮箱隐私校验仍开启会触发
#   GE007（hook declined）；届时需在 Gitee 账号设置关闭"禁止命令行推送暴露个人邮箱"，
#   或回到带 filter-branch 重写的版本。

name: Sync to Gitee

on:
  push:
    branches: [main]

# 密集 push 防竞态：同一时间只保留一个同步 run（进行中的旧 run 自动取消），
# 保证 Gitee 最终等于 GitHub 最新版本（force push 乱序覆盖的兜底）
concurrency:
  group: gitee-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror main to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # Gitee HTTP Basic 认证：username=Gitee 用户名，password=私人令牌
          git config --global credential.helper '!f() { echo "username=lin_Yanyi"; echo "password=${GITEE_TOKEN}"; }; f'
          # 低速超时：Gitee 对海外 runner 响应慢，避免 git 无限挂起
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 90
          git remote add gitee https://gitee.com/lin_Yanyi/eco-builder.git
          git push gitee "refs/heads/main:refs/heads/main"
          # 把 Gitee 默认分支设为 main（否则新仓库默认空 master，clone 会拉空）
          curl -s -X PATCH "https://gitee.com/api/v5/repos/lin_Yanyi/eco-builder" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"default_branch\":\"main\"}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('Gitee 默认分支:', d.get('default_branch'))" 2>/dev/null || true
