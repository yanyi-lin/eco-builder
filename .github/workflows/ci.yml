name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Feasibility verification
        run: npm run verify:feasibility

      - name: Build
        run: npm run build

      # CF Workers 打包校验（Hono 双运行时）：验证 worker/index.ts 可被 wrangler 打包、
      # assets 目录存在、vars/secrets 配置合法（--dry-run 不实际部署，无需 CF 凭据）
      - name: Cloudflare Workers bundle check
        run: npx wrangler deploy --dry-run
